stages:
  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/Car_Hacking_Challenge_Dataset
    outs:
      - data/interim/car_hacking_with_session.parquet

  split:
    cmd: PYTHONPATH=src python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/params.py
      - data/interim/car_hacking_with_session.parquet
    params:
      - split.val_sessions
      - split.test_sessions
    outs:
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet

  feature:
    cmd: PYTHONPATH=src python src/data/feature.py
    deps:
      - src/data/feature.py
      - src/utils/params.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet
    params:
      - feature.window_ms
    outs:
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet

  train_mlp:
    cmd: PYTHONPATH=src python src/train_mlp.py
    deps:
      - src/train_mlp.py
      - src/data/mlp_dataset.py
      - src/model/mlp.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    outs:
      - checkpoints/mlp_best.keras:
          cache: false
      - checkpoints/mlp_final.keras:
          cache: false
      - checkpoints/mlp_norm_stats.json:
          cache: false
      - reports/metrics/mlp_best_training_metrics.json:
          cache: false

  eval_mlp:
    cmd: PYTHONPATH=src python src/eval_mlp.py
    deps:
      - src/eval_mlp.py
      - src/data/mlp_dataset.py
      - src/utils/eval_reporting.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - checkpoints/mlp_best.keras
      - checkpoints/mlp_norm_stats.json
      - reports/metrics/mlp_best_training_metrics.json
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/test.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    metrics:
      - reports/metrics/mlp_classification_report.json:
          cache: false
    outs:
      - reports/metrics/mlp_classification_report.txt:
          cache: false
      - reports/figures/mlp_train_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_eval_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_test_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_test_confusion_matrix_counts.png:
          cache: false

  train_mlp_window:
    cmd: PYTHONPATH=src python src/train_mlp_window.py
    deps:
      - src/train_mlp_window.py
      - src/data/mlp_window_dataset.py
      - src/data/mlp_dataset.py
      - src/model/mlp_window.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.mlp_window
      - training.mlp_window
      - mlflow.experiment_mlp_window
    outs:
      - checkpoints/mlp_window_best.keras:
          cache: false
      - checkpoints/mlp_window_final.keras:
          cache: false
      - checkpoints/mlp_window_norm_stats.json:
          cache: false
      - reports/metrics/mlp_window_best_training_metrics.json:
          cache: false

  eval_mlp_window:
    cmd: PYTHONPATH=src python src/eval_mlp_window.py
    deps:
      - src/eval_mlp_window.py
      - src/data/mlp_window_dataset.py
      - src/data/mlp_dataset.py
      - src/utils/eval_reporting.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - checkpoints/mlp_window_best.keras
      - checkpoints/mlp_window_norm_stats.json
      - reports/metrics/mlp_window_best_training_metrics.json
      - data/processed/car_hacking/featured/test.parquet
    params:
      - model.mlp_window
      - training.mlp_window
      - mlflow.experiment_mlp_window
    metrics:
      - reports/metrics/mlp_window_classification_report.json:
          cache: false
    outs:
      - reports/metrics/mlp_window_classification_report.txt:
          cache: false
      - reports/figures/mlp_window_train_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_eval_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_test_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_test_confusion_matrix_counts.png:
          cache: false
