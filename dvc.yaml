stages:
  ingest:
    cmd: PYTHONPATH=src python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/Car_Hacking_Challenge_Dataset
    outs:
      - data/interim/car_hacking_with_session.parquet

  split:
    cmd: PYTHONPATH=src python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/params.py
      - data/interim/car_hacking_with_session.parquet
    params:
      - pipeline.profile
      - dataset.default.val_sessions
      - dataset.default.test_sessions
    outs:
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet

  feature:
    cmd: PYTHONPATH=src python src/data/feature.py
    deps:
      - src/data/feature.py
      - src/utils/params.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet
    outs:
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet

  sequence_ingest:
    cmd: PYTHONPATH=src python src/data/ingest.py --profile sequence_window
    deps:
      - src/data/ingest.py
      - src/data/adapters/can_bigrubert.py
      - data/raw/Car_Hacking_Challenge_Dataset
    params:
      - dataset.raw_dir
      - dataset.sequence_window.interim_path
    outs:
      - data/interim/sequence_window.parquet

  sequence_split:
    cmd: PYTHONPATH=src python src/data/split.py --profile sequence_window
    deps:
      - src/data/split.py
      - src/data/adapters/can_bigrubert.py
      - data/interim/sequence_window.parquet
    params:
      - data.sequence_window
      - dataset.sequence_window.processed_dir
    outs:
      - data/processed/sequence_window/train.parquet
      - data/processed/sequence_window/val.parquet
      - data/processed/sequence_window/test.parquet

  sequence_feature:
    cmd: PYTHONPATH=src python src/data/feature.py --profile sequence_window
    deps:
      - src/data/feature.py
      - src/data/adapters/can_bigrubert.py
      - data/interim/sequence_window.parquet
      - data/processed/sequence_window/train.parquet
      - data/processed/sequence_window/val.parquet
      - data/processed/sequence_window/test.parquet
    params:
      - data.sequence_window
      - dataset.sequence_window.featured_dir
    outs:
      - data/processed/sequence_window/featured/train.parquet
      - data/processed/sequence_window/featured/val.parquet
      - data/processed/sequence_window/featured/test.parquet

  train_mlp:
    cmd: PYTHONPATH=src python src/train_mlp.py
    deps:
      - src/train_mlp.py
      - src/data/mlp_dataset.py
      - src/model/mlp.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    outs:
      - checkpoints/mlp_best.keras:
          cache: false
      - checkpoints/mlp_final.keras:
          cache: false
      - checkpoints/mlp_norm_stats.json:
          cache: false
      - reports/metrics/mlp_best_training_metrics.json:
          cache: false

  eval_mlp:
    cmd: PYTHONPATH=src python src/eval_mlp.py
    deps:
      - src/eval_mlp.py
      - src/data/mlp_dataset.py
      - src/utils/eval_reporting.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - checkpoints/mlp_best.keras
      - checkpoints/mlp_norm_stats.json
      - reports/metrics/mlp_best_training_metrics.json
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    metrics:
      - reports/metrics/mlp_classification_report.json:
          cache: false
    outs:
      - reports/metrics/mlp_classification_report.txt:
          cache: false
      - reports/figures/mlp_train_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_val_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_test_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_test_confusion_matrix_counts.png:
          cache: false

  train_mlp_window:
    cmd: PYTHONPATH=src python src/train_mlp_window.py
    deps:
      - src/train_mlp_window.py
      - src/data/mlp_window_dataset.py
      - src/data/mlp_dataset.py
      - src/model/mlp_window.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.mlp_window
      - training.mlp_window
      - mlflow.experiment_mlp_window
    outs:
      - checkpoints/mlp_window_best.keras:
          cache: false
      - checkpoints/mlp_window_final.keras:
          cache: false
      - checkpoints/mlp_window_norm_stats.json:
          cache: false
      - reports/metrics/mlp_window_best_training_metrics.json:
          cache: false

  eval_mlp_window:
    cmd: PYTHONPATH=src python src/eval_mlp_window.py
    deps:
      - src/eval_mlp_window.py
      - src/data/mlp_window_dataset.py
      - src/data/mlp_dataset.py
      - src/utils/eval_reporting.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - checkpoints/mlp_window_best.keras
      - checkpoints/mlp_window_norm_stats.json
      - reports/metrics/mlp_window_best_training_metrics.json
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet
    params:
      - model.mlp_window
      - training.mlp_window
      - mlflow.experiment_mlp_window
    metrics:
      - reports/metrics/mlp_window_classification_report.json:
          cache: false
    outs:
      - reports/metrics/mlp_window_classification_report.txt:
          cache: false
      - reports/figures/mlp_window_train_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_val_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_test_confusion_matrix.png:
          cache: false
      - reports/figures/mlp_window_test_confusion_matrix_counts.png:
          cache: false

  train_can_bigrubert:
    cmd: PYTHONPATH=src python src/train_can_bigrubert.py
    deps:
      - src/train_can_bigrubert.py
      - src/data/can_bigrubert_dataset.py
      - src/model/can_bigrubert.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/sequence_window/featured/train.parquet
      - data/processed/sequence_window/featured/val.parquet
    params:
      - data.sequence_window
      - model.can_bigrubert
      - training.can_bigrubert
      - mlflow.experiment_can_bigrubert
    outs:
      - checkpoints/can_bigrubert_best.keras:
          cache: false
      - checkpoints/can_bigrubert_final.keras:
          cache: false
      - checkpoints/can_bigrubert_mlflow_run_id.txt:
          cache: false
      - reports/metrics/can_bigrubert_best_training_metrics.json:
          cache: false

  eval_can_bigrubert:
    cmd: PYTHONPATH=src python src/eval_can_bigrubert.py
    deps:
      - src/eval_can_bigrubert.py
      - src/data/can_bigrubert_dataset.py
      - src/model/can_bigrubert.py
      - src/utils/eval_reporting.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - checkpoints/can_bigrubert_best.keras
      - reports/metrics/can_bigrubert_best_training_metrics.json
      - data/processed/sequence_window/featured/train.parquet
      - data/processed/sequence_window/featured/val.parquet
      - data/processed/sequence_window/featured/test.parquet
    params:
      - data.sequence_window
      - model.can_bigrubert
      - training.can_bigrubert
      - mlflow.experiment_can_bigrubert
    metrics:
      - reports/metrics/can_bigrubert_classification_report.json:
          cache: false
    outs:
      - reports/metrics/can_bigrubert_classification_report.txt:
          cache: false
      - reports/figures/can_bigrubert_train_confusion_matrix.png:
          cache: false
      - reports/figures/can_bigrubert_val_confusion_matrix.png:
          cache: false
      - reports/figures/can_bigrubert_test_confusion_matrix.png:
          cache: false
      - reports/figures/can_bigrubert_test_confusion_matrix_counts.png:
          cache: false
