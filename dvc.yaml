stages:

  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/Car_Hacking_Challenge_Dataset
    outs:
      - data/interim/car_hacking_with_session.parquet

  split:
    cmd: PYTHONPATH=src python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/params.py
      - data/interim/car_hacking_with_session.parquet
    params:
      - split.val_sessions
      - split.test_sessions
    outs:
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet

  feature:
    cmd: PYTHONPATH=src python src/data/feature.py
    deps:
      - src/data/feature.py
      - src/utils/params.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet
    params:
      - feature.window_ms
    outs:
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet

  train_spatial:
    cmd: PYTHONPATH=src python src/train_spatial.py
    deps:
      - src/train_spatial.py
      - src/data/dataset.py
      - src/model/spatial_transformer.py
      - src/model/embeddings.py
      - src/model/transformer.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
    params:
      - model.spatial
      - training.spatial
    outs:
      - checkpoints/spatial_best.keras

  eval_spatial:
    cmd:  PYTHONPATH=src python src/eval_spatial.py
    deps:
      - src/eval_spatial.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - checkpoints/spatial_best.keras
      - data/processed/car_hacking/test.parquet
    metrics:
      - reports/metrics/spatial_classification_report.json:
          cache: false
    outs:
      - reports/figures/spatial_confusion_matrix.png

  train_hybrid:
    cmd: PYTHONPATH=src python src/train_hybrid.py
    deps:
      - src/train_hybrid.py
      - src/data/temporal_dataset.py
      - src/model/hybrid_ids.py
      - src/model/temporal_gru.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/class_weights.py
      - src/utils/metrics.py
      - checkpoints/spatial_best.keras
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.hybrid
      - training.hybrid
    outs:
      - checkpoints/hybrid_best.keras
      - checkpoints/hybrid_final.keras
      - checkpoints/temporal_norm_stats.json

  eval_hybrid:
    cmd: PYTHONPATH=src python src/eval_hybrid.py
    deps:
      - src/eval_hybrid.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - checkpoints/hybrid_best.keras
      - checkpoints/temporal_norm_stats.json
      - data/processed/car_hacking/featured/test.parquet
    metrics:
      - reports/metrics/hybrid_classification_report.json:
          cache: false
    outs:
      - reports/figures/hybrid_confusion_matrix.png
      - reports/figures/hybrid_confusion_matrix_normalized.png
