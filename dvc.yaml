stages:
  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/Car_Hacking_Challenge_Dataset
    outs:
      - data/interim/car_hacking_with_session.parquet

  split:
    cmd: PYTHONPATH=src python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/params.py
      - data/interim/car_hacking_with_session.parquet
    params:
      - split.val_sessions
      - split.test_sessions
    outs:
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet

  feature:
    cmd: PYTHONPATH=src python src/data/feature.py
    deps:
      - src/data/feature.py
      - src/utils/params.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet
    params:
      - feature.window_ms
    outs:
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet

  train_streaming:
    cmd: PYTHONPATH=src python src/train_streaming.py
    deps:
      - src/train_streaming.py
      - src/data/streaming_dataset.py
      - src/model/streaming_ids.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.streaming
      - training.streaming
    outs:
      - checkpoints/streaming_best.keras:
          cache: false
      - checkpoints/streaming_final.keras:
          cache: false
      - checkpoints/streaming_norm_stats.json:
          cache: false

  eval_streaming:
    cmd: PYTHONPATH=src python src/eval_streaming.py
    deps:
      - src/eval_streaming.py
      - src/utils/params.py
      - checkpoints/streaming_best.keras
      - checkpoints/streaming_norm_stats.json
      - data/processed/car_hacking/featured/test.parquet
    metrics:
      - reports/metrics/streaming_classification_report.json:
          cache: false
    outs:
      - reports/figures/streaming_confusion_matrix.png:
          cache: false
      - reports/figures/streaming_confusion_matrix_normalized.png:
          cache: false

  train_mlp:
    cmd: PYTHONPATH=src python src/train_mlp.py
    deps:
      - src/train_mlp.py
      - src/data/mlp_dataset.py
      - src/data/streaming_dataset.py
      - src/model/mlp.py
      - src/utils/metrics.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    outs:
      - checkpoints/mlp_best.keras:
          cache: false
      - checkpoints/mlp_final.keras:
          cache: false
      - checkpoints/mlp_norm_stats.json:
          cache: false

  eval_mlp:
    cmd: PYTHONPATH=src python src/eval_mlp.py
    deps:
      - src/eval_mlp.py
      - src/data/mlp_dataset.py
      - src/data/streaming_dataset.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - checkpoints/mlp_best.keras
      - checkpoints/mlp_norm_stats.json
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/test.parquet
    params:
      - model.mlp
      - training.mlp
      - mlflow.experiment_mlp
    metrics:
      - reports/metrics/mlp_classification_report.json:
          cache: false
