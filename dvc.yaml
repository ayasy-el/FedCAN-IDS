stages:

  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/Car_Hacking_Challenge_Dataset
    outs:
      - data/interim/car_hacking_with_session.parquet

  split:
    cmd: PYTHONPATH=src python src/data/split.py
    deps:
      - src/data/split.py
      - src/utils/params.py
      - data/interim/car_hacking_with_session.parquet
    params:
      - split.val_sessions
      - split.test_sessions
    outs:
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet

  feature:
    cmd: PYTHONPATH=src python src/data/feature.py
    deps:
      - src/data/feature.py
      - src/utils/params.py
      - data/processed/car_hacking/train.parquet
      - data/processed/car_hacking/val.parquet
      - data/processed/car_hacking/test.parquet
    params:
      - feature.window_ms
    outs:
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
      - data/processed/car_hacking/featured/test.parquet

  train_streaming:
    cmd: PYTHONPATH=src python src/train_streaming.py
    deps:
      - src/train_streaming.py
      - src/data/streaming_dataset.py
      - src/model/streaming_ids.py
      - src/utils/params.py
      - src/utils/mlflow_utils.py
      - src/utils/metrics.py
      - data/processed/car_hacking/featured/train.parquet
      - data/processed/car_hacking/featured/val.parquet
    params:
      - model.streaming
      - training.streaming
    outs:
      - checkpoints/streaming_best.keras
      - checkpoints/streaming_final.keras
      - checkpoints/streaming_norm_stats.json

  eval_streaming:
    cmd: PYTHONPATH=src python src/eval_streaming.py
    deps:
      - src/eval_streaming.py
      - src/utils/params.py
      - checkpoints/streaming_best.keras
      - checkpoints/streaming_norm_stats.json
      - data/processed/car_hacking/featured/test.parquet
    metrics:
      - reports/metrics/streaming_classification_report.json:
          cache: false
