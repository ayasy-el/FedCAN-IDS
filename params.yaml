dataset:
  name: car_hacking
  raw_dir: data/raw/Car_Hacking_Challenge_Dataset
  interim_path: data/interim/car_hacking_with_session.parquet
  processed_dir: data/processed/car_hacking
  featured_dir: data/processed/car_hacking/featured

split:
  val_sessions:
    - Pre_train_D_1
    - Pre_train_S_1
  test_sessions:
    - Pre_train_D_2
    - Pre_train_S_2

feature:
  window_ms: 20

model:
  spatial:
    d_model: 4
    num_heads: 2
    ff_dim: 8
    num_layers: 1
    num_classes: 5
    dropout: 0.1

  hybrid:
    d_model: 4
    num_heads: 2
    ff_dim: 8
    num_layers: 1
    gru_units: 16
    num_classes: 5
    dropout: 0.1
    seq_len: 32

training:
  spatial:
    batch_size: 256
    epochs: 50
    learning_rate: 0.001

  hybrid:
    batch_size: 256
    epochs_stage1: 50
    epochs_stage2: 10
    learning_rate_stage1: 0.001
    learning_rate_stage2: 0.0001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_spatial: "hybrid_ids_spatial"
  experiment_hybrid: "hybrid_ids_hybrid"