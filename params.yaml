dataset:
  name: car_hacking
  raw_dir: data/raw/Car_Hacking_Challenge_Dataset
  interim_path: data/interim/car_hacking_with_session.parquet
  processed_dir: data/processed/car_hacking
  featured_dir: data/processed/car_hacking/featured

split:
  val_sessions:
    - Pre_train_D_1
    - Pre_train_S_1
  test_sessions:
    - Pre_train_D_2
    - Pre_train_S_2

feature:
  window_ms: 0

model:
  streaming:
    d_model: 32
    can_id_bits: 11
    can_id_projection_dim: 8
    numeric_dim: 11
    numeric_projection_dim: 24
    d_qk: 8
    d_v: 8
    global_memory: 64
    same_id_memory: 16
    num_ids: 2048
    num_classes: 5
    dropout: 0.1
  mlp:
    can_id_bits: 11
    num_classes: 5

training:
  streaming:
    batch_size: 5
    chunk_len: 256
    epochs: 20
    learning_rate: 0.001
  mlp:
    batch_size: 256
    epochs: 20
    learning_rate: 0.001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_streaming: "can_ids_streaming"
  experiment_mlp: "can_ids_mlp"
