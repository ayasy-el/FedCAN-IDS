dataset:
  name: carhacking_a&d
  raw_dir: data/raw/Car_Hacking_Challenge_Dataset/0_Preliminary
  ingest_adapter: car_hacking_attack_defense
  variant: null
  exclude_files:
    - Pre_train_D_0.csv
    - Pre_train_S_0.csv
  interim_path: data/interim/canonical.parquet
  prepared_path: data/interim/prepared.parquet
  processed_dir: data/processed/current

prepare:
  label_schema: ten_state_attack
  features: []

split:
  unit: window
  strategy: stratified_random
  window_size: 16
  stride: 8
  val_ratio: 0.2
  test_ratio: 0.2
  downsample: false
  random_seed: 42
  val_sessions: []
  test_sessions: []

model:
  can_st_transformer:
    vocab_size: 2306
    d_model: 64
    num_heads: 4
    num_layers: 4
    dim_feedforward: 64
    dropout: 0.0
    window_size: 64
    range_adjustment: 0
    cutoff_frames: true
  can_ae_transformer:
    d_model: 10
    num_heads: 10
    num_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
    granularity: 1e-8
    max_time_position: 10000
  can_bigrubert:
    max_length: 22
    bert_checkpoint: bert-base-uncased
    tokenizer_checkpoint: bert-base-uncased
    bigru_hidden_size: 512
    dropout: 0.1
  mlp:
    can_id_bits: 11
  mlp_window:
    can_id_bits: 11
    hidden_dims: [32, 16]
    dropout: false
  tct_ids:
    d_model: 10
    num_heads: 1
    num_layers: 3
    dim_feedforward: 40
    mlp_hidden_dim: 40
    tcn_filters: 100
    tcn_kernel_size: 2
    tcn_dilations: [1, 2, 4]
    use_weight_norm: true
    dropout: 0.1
    alpha_smooth: 1.0e-7
    fusion: concat
    pooling: last
  cnn_lstm:
    num_features: 5
    cnn_filters: 16
    cnn_kernel_size: 3
    dropout: 0.2
    lstm_hidden_size: 32
    rolling_w: 64
    label_rule: any_attack
  transformer_gru:
    num_features: 5
    d_model: 16
    num_heads: 2
    dim_feedforward: 32
    dropout: 0.2
    gru_hidden_size: 32
    rolling_w: 50
    label_rule: any_attack
  hierarchical_transformer_gru:
    num_features: 5
    d_model: 16
    num_heads: 2
    dim_feedforward: 32
    dropout: 0.2
    gru_hidden_size: 32
    rolling_w: 50
    label_rule: any_attack
  hat_ids:
    num_features: 5
    d_model: 32
    num_heads: 2
    dim_feedforward: 64
    dropout: 0.2
    alpha: 1.0e-7
    rolling_w: 50
    label_rule: any_attack

training:
  can_st_transformer:
    batch_size: 32
    epochs: 20
    learning_rate: 0.001
  can_ae_transformer:
    batch_size: 32
    epochs: 100
    learning_rate: 0.0001
    warmup_steps: 100
  mlp:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  can_bigrubert:
    batch_size: 32
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.00001
    early_stopping_patience: 10
    early_stopping_min_delta: 0.0001
  mlp_window:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  tct_ids:
    batch_size: 32
    epochs: 100
    warmup_epochs: 50
    learning_rate: 0.001
    weight_decay: 0.00001
    lambda_rdrop: 0.1
  cnn_lstm:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  transformer_gru:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  hierarchical_transformer_gru:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  hat_ids:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_can_st_transformer: "road_masq"
  experiment_can_ae_transformer: "road_masq"
  experiment_mlp: "road_masq"
  experiment_mlp_window: "road_masq"
  experiment_can_bigrubert: "road_masq"
  experiment_tct_ids: "road_masq"
  experiment_cnn_lstm: "can_ids_cnn_lstm"
  experiment_transformer_gru: "can_ids_transformer_gru"
  experiment_hierarchical_transformer_gru: "can_ids_hierarchical_transformer_gru"
  experiment_hat_ids: "can_ids_hat_ids"
