dataset:
  name: road
  raw_dir: data/raw/road
  ingest_adapter: road_raw
  variant: masquerade
  exclude_files: null
  interim_path: data/interim/canonical.parquet
  prepared_path: data/interim/prepared.parquet
  processed_dir: data/processed/current

prepare:
  label_schema: road
  features: []

split:
  unit: window
  strategy: stratified_random
  window_size: 15
  stride: 1
  val_ratio: 0.0
  test_ratio: 0.2
  downsample: false
  random_seed: 42
  val_sessions: []
  test_sessions: []

experiment:
  model: tct_ids

model:
  can_st_transformer:
    vocab_size: 2306
    d_model: 64
    num_heads: 4
    num_layers: 4
    dim_feedforward: 64
    dropout: 0.0
    window_size: 64
    range_adjustment: 0
    cutoff_frames: true
  can_ae_transformer:
    d_model: 10
    num_heads: 10
    num_layers: 6
    dim_feedforward: 2048
    dropout: 0.1
    granularity: 1e-8
    max_time_position: 10000
  can_bigrubert:
    max_length: 22
    bert_checkpoint: bert-base-uncased
    tokenizer_checkpoint: bert-base-uncased
    bigru_hidden_size: 512
    dropout: 0.1
  mlp:
    can_id_bits: 11
  mlp_window:
    can_id_bits: 11
    hidden_dims: [32, 16]
    dropout: false
  tct_ids:
    d_model: 10
    num_heads: 1
    num_layers: 3
    dim_feedforward: 40
    mlp_hidden_dim: 40
    tcn_filters: 10
    tcn_kernel_size: 2
    tcn_dilations: [1, 2, 4]
    dropout: 0.1
    alpha_smooth: 1.0e-7
    fusion: add
    pooling: sum

training:
  can_st_transformer:
    batch_size: 1024
    epochs: 20
    learning_rate: 0.001
  can_ae_transformer:
    batch_size: 32
    epochs: 100
    learning_rate: 0.0001
    warmup_steps: 100
  mlp:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001
  can_bigrubert:
    batch_size: 16
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.00001
    early_stopping_patience: 10
    early_stopping_min_delta: 0.0001
  mlp_window:
    batch_size: 32
    epochs: 100
    learning_rate: 0.001
  tct_ids:
    batch_size: 32
    epochs: 300
    warmup_epochs: 50
    learning_rate: 0.001
    weight_decay: 0.00001
    lambda_rdrop: 0.1

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_can_st_transformer: "can_st_transformer"
  experiment_can_ae_transformer: "can_ae_transformer"
  experiment_mlp: "can_ids_mlp"
  experiment_mlp_window: "can_ids_mlp_window"
  experiment_can_bigrubert: "can_bigrubert"
  experiment_tct_ids: "can_ids_tct"
