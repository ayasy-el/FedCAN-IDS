dataset:
  name: car_hacking
  raw_dir: data/raw/Car_Hacking_Challenge_Dataset
  raw_files:
    - Pre_train_D_1.csv
    - Pre_train_D_2.csv
    - Pre_submit_D.csv
    - Pre_train_S_1.csv
    - Pre_train_S_2.csv
    - Pre_submit_S.csv
  interim_path: data/interim/canonical.parquet
  prepared_path: data/interim/prepared.parquet
  processed_dir: data/processed/current

prepare:
  label_schema: ten_state_attack

split:
  unit: window
  strategy: stratified_random
  window_size: 256
  stride: 1
  downsample: true
  random_seed: 42
  val_sessions:
    - Pre_train_D_1
    - Pre_train_S_1
  test_sessions:
    - Pre_train_D_2
    - Pre_train_S_2

experiment:
  model: can_bigrubert

model:
  can_bigrubert:
    max_length: 22
    bert_checkpoint: bert-base-uncased
    tokenizer_checkpoint: bert-base-uncased
    bigru_hidden_size: 512
    dropout: 0.1
  mlp:
    can_id_bits: 11
  mlp_window:
    can_id_bits: 11
    hidden_dims: [32, 16]
    dropout: false

training:
  mlp:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001
  can_bigrubert:
    batch_size: 16
    epochs: 120
    learning_rate: 0.001
    weight_decay: 0.00001
    early_stopping_patience: 5
    early_stopping_min_delta: 0.0001
  mlp_window:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_mlp: "can_ids_mlp"
  experiment_mlp_window: "can_ids_mlp_window"
  experiment_can_bigrubert: "can_bigrubert"
