dataset:
  name: HCRLCarHacking
  raw_dir: "data/raw/9) Car-Hacking Dataset"
  ingest_adapter: hcrl_carhacking
  raw_files: null
  interim_path: data/interim/canonical.parquet
  prepared_path: data/interim/prepared.parquet
  processed_dir: data/processed/current

prepare:
  label_schema: HCRLCarHacking
  features: []

split:
  unit: frame
  # window_size: 256
  # stride: 1
  downsample: false
  random_seed: 42
  strategy: stratified_random
  # val_sessions:
  #   - Pre_train_D_1
  #   - Pre_train_S_1
  # test_sessions:
  #   - Pre_train_D_2
  #   - Pre_train_S_2

experiment:
  model: mlp

model:
  can_bigrubert:
    max_length: 22
    bert_checkpoint: bert-base-uncased
    tokenizer_checkpoint: bert-base-uncased
    bigru_hidden_size: 512
    dropout: 0.1
  mlp:
    can_id_bits: 11
  mlp_window:
    can_id_bits: 11
    hidden_dims: [32, 16]
    dropout: false

training:
  mlp:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001
  can_bigrubert:
    batch_size: 16
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.00001
    early_stopping_patience: 10
    early_stopping_min_delta: 0.0001
  mlp_window:
    batch_size: 256
    epochs: 100
    learning_rate: 0.001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_mlp: "can_ids_mlp"
  experiment_mlp_window: "can_ids_mlp_window"
  experiment_can_bigrubert: "can_bigrubert"
