dataset:
  name: car_hacking
  raw_dir: data/raw/Car_Hacking_Challenge_Dataset
  interim_path: data/interim/car_hacking_with_session.parquet
  processed_dir: data/processed/car_hacking
  featured_dir: data/processed/car_hacking/featured

split:
  val_sessions:
    - Pre_train_D_1
    - Pre_train_S_1
  test_sessions:
    - Pre_train_D_2
    - Pre_train_S_2

feature:
  window_ms: 0

model:
  mlp:
    can_id_bits: 11
    num_classes: 5
  mlp_window:
    can_id_bits: 11
    num_classes: 5
    window_size: 16
    stride: 8
    hidden_dims: [32, 16]
    dropout: 0.2

training:
  mlp:
    batch_size: 256
    epochs: 20
    learning_rate: 0.001
  mlp_window:
    batch_size: 256
    epochs: 20
    learning_rate: 0.001

mlflow:
  tracking_uri: "https://dagshub.com/ayasy-el/FedCAN-IDS.mlflow"
  experiment_mlp: "can_ids_mlp"
  experiment_mlp_window: "can_ids_mlp_window"
